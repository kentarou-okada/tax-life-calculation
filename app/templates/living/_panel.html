{# 年度パネル：年切替のたびに #living-panel ごと差し替える #}
<div id="living-panel">
  <div class="year-bar">
    <label for="living-year"><strong>年</strong></label>
    <input id="living-year" type="number" name="year" value="{{ year }}" min="2000" max="2100" step="1"
           hx-get="/living/panel" hx-target="#living-panel" hx-swap="outerHTML"
           hx-trigger="change" hx-include="this">
    <span class="muted">単位＝円（10円単位）</span>
  </div>

  <div class="data-bar">
    <span class="muted">エクスポート：</span>
    <a class="ghost-link" href="/export/living.csv?year={{ year }}">月次収支 CSV</a>
    <a class="ghost-link" href="/export/living.xlsx?year={{ year }}">月次収支 Excel</a>
    <span class="sep">|</span>
    <button type="button" class="ghost tiny"
            hx-post="/export/backup" hx-target="#backup-msg" hx-swap="innerHTML">DB バックアップ</button>
    <span id="backup-msg"></span>
  </div>

  {% include "living/_tax_guide.html" %}

  <div id="annual-summary">
    {% include "living/_annual_inner.html" %}
  </div>

  {% include "living/_month_panel.html" %}
</div>

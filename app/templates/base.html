<!doctype html>
<html lang="ja">
<head>

  <title>{% block title %}家計・税金管理{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v | default('') }}">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <header class="app-header">
    <h1>家計・税金管理</h1>
    <nav>
      <a href="/tax" class="{% block nav_tax %}{% endblock %}">税金算出</a>

    ローカル試算ツール（単位＝万円）。確定申告本体はマネーフォワードで行う。
